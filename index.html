<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCT Support Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f5f3ee;
    --surface:#ffffff;
    --surface-2:#faf8f4;
    --border:#e4e0d6;
    --text:#201e19;
    --text-muted:#726d62;
    --accent:#1f6f5c;
    --accent-strong:#155647;
    --accent-soft:#e3efec;
    --focus:#1f6f5c;
    --shadow: 0 1px 2px rgba(32,30,25,0.06), 0 6px 20px -8px rgba(32,30,25,0.12);

    --status-open:#a8531d;       --status-open-bg:#faead9;
    --status-progress:#215f96;   --status-progress-bg:#e2edf7;
    --status-resolved:#2c7a45;   --status-resolved-bg:#e2f2e6;
    --status-closed:#726d62;     --status-closed-bg:#eae7df;

    --pri-urgent:#b52a2a;  --pri-urgent-bg:#f9e2e2;
    --pri-high:#a5641b;    --pri-high-bg:#f7ecd9;
    --pri-medium:#8a7519;  --pri-medium-bg:#f3eed3;
    --pri-low:#456b49;     --pri-low-bg:#e3ede3;

    --inst-norrsken:#2f6f86;  --inst-norrsken-bg:#e3eef2;
    --inst-hut:#8a5a35;       --inst-hut-bg:#f2e8dc;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16150f; --surface:#1e1c17; --surface-2:#24221c; --border:#38352b;
      --text:#eeebe2; --text-muted:#a49d8c;
      --accent:#49ac91; --accent-strong:#5cc0a3; --accent-soft:#213631;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -10px rgba(0,0,0,0.5);
      --status-open:#e2985d;      --status-open-bg:#3a2a1a;
      --status-progress:#7cb0e3;  --status-progress-bg:#1c2c3c;
      --status-resolved:#7fce97;  --status-resolved-bg:#1c3324;
      --status-closed:#a49d8c;    --status-closed-bg:#2c2a23;
      --pri-urgent:#e8837c;  --pri-urgent-bg:#3b1f1e;
      --pri-high:#e3ac6f;    --pri-high-bg:#3a2c19;
      --pri-medium:#d7c377;  --pri-medium-bg:#332e19;
      --pri-low:#96c99b;     --pri-low-bg:#22301f;
      --inst-norrsken:#6fb8d1; --inst-norrsken-bg:#1c2f36;
      --inst-hut:#d1a06f;      --inst-hut-bg:#332619;
    }
  }
  :root[data-theme="dark"]{
    --bg:#16150f; --surface:#1e1c17; --surface-2:#24221c; --border:#38352b;
    --text:#eeebe2; --text-muted:#a49d8c;
    --accent:#49ac91; --accent-strong:#5cc0a3; --accent-soft:#213631;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -10px rgba(0,0,0,0.5);
    --status-open:#e2985d; --status-open-bg:#3a2a1a;
    --status-progress:#7cb0e3; --status-progress-bg:#1c2c3c;
    --status-resolved:#7fce97; --status-resolved-bg:#1c3324;
    --status-closed:#a49d8c; --status-closed-bg:#2c2a23;
    --pri-urgent:#e8837c; --pri-urgent-bg:#3b1f1e;
    --pri-high:#e3ac6f; --pri-high-bg:#3a2c19;
    --pri-medium:#d7c377; --pri-medium-bg:#332e19;
    --pri-low:#96c99b; --pri-low-bg:#22301f;
    --inst-norrsken:#6fb8d1; --inst-norrsken-bg:#1c2f36;
    --inst-hut:#d1a06f;      --inst-hut-bg:#332619;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric:tabular-nums; }
  a{color:var(--accent);}
  button{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  h1,h2,h3,h4{ text-wrap:balance; margin:0; }
  ::placeholder{ color:var(--text-muted); opacity:0.75; }

  .app{ min-height:100vh; display:flex; flex-direction:column; }

  header.topbar{
    position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--border);
    padding:10px 20px; display:flex; align-items:center; gap:16px;
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-right:auto; min-width:0; }
  .brand-mark{
    width:52px; height:34px; border-radius:8px; flex:none; background:#fff; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; padding:3px; box-sizing:border-box;
  }
  .brand-mark img{ display:block; width:100%; height:100%; object-fit:contain; }
  .brand-text{ min-width:0; }
  .logo-badge{
    display:inline-flex; align-items:center; justify-content:center; background:#fff;
    border:1px solid var(--border); border-radius:7px; box-sizing:border-box; flex:none;
  }
  .logo-badge img{ display:block; object-fit:contain; }
  .brand-text .t1{ font-weight:700; font-size:15px; letter-spacing:0.01em; }
  .brand-text .t2{ font-size:12px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .icon-btn{
    background:none; border:1px solid transparent; border-radius:8px; width:36px; height:36px;
    display:flex; align-items:center; justify-content:center; color:var(--text); cursor:pointer; position:relative; flex:none;
  }
  .icon-btn:hover{ background:var(--surface-2); border-color:var(--border); }
  .badge-count{
    position:absolute; top:2px; right:2px; min-width:16px; height:16px; padding:0 4px; background:var(--pri-urgent); color:#fff;
    border-radius:8px; font-size:10px; font-weight:600; display:flex; align-items:center; justify-content:center; font-family:"IBM Plex Mono";
  }
  .identity-chip{
    display:flex; align-items:center; gap:8px; padding:5px 10px 5px 6px; border:1px solid var(--border); border-radius:999px;
    background:var(--surface-2); cursor:pointer; flex:none;
  }
  .identity-chip.locked{ cursor:default; }
  .identity-chip .av{
    width:22px; height:22px; border-radius:50%; background:var(--accent-soft); color:var(--accent-strong);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;
  }
  .identity-chip .who{ font-size:12.5px; line-height:1.25; text-align:left; }
  .identity-chip .who b{ font-weight:600; display:block; }
  .identity-chip .who span{ color:var(--text-muted); font-size:11px; }

  .shell{ flex:1; display:flex; min-height:0; }
  nav.rail{
    width:196px; flex:none; border-right:1px solid var(--border); background:var(--surface);
    padding:16px 12px; display:flex; flex-direction:column; gap:2px;
  }
  nav.rail button{
    display:flex; align-items:center; gap:10px; text-align:left; background:none; border:none; border-radius:8px;
    padding:9px 10px; color:var(--text-muted); font-size:13.5px; font-weight:500; cursor:pointer;
  }
  nav.rail button svg{ flex:none; opacity:0.8; }
  nav.rail button:hover{ background:var(--surface-2); color:var(--text); }
  nav.rail button.active{ background:var(--accent-soft); color:var(--accent-strong); }
  nav.rail button.active svg{ opacity:1; }
  nav.rail .rail-foot{ margin-top:auto; padding:10px; font-size:11px; color:var(--text-muted); border-top:1px solid var(--border); }

  main.content{ flex:1; min-width:0; padding:24px 28px 60px; max-width:1080px; }
  .tabstrip{ display:none; }

  @media (max-width: 760px){
    nav.rail{ display:none; }
    .tabstrip{ display:flex; gap:4px; padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto; }
    .tabstrip button{
      flex:none; background:none; border:1px solid var(--border); border-radius:999px; padding:7px 14px;
      font-size:13px; font-weight:500; color:var(--text-muted); cursor:pointer;
    }
    .tabstrip button.active{ background:var(--accent-soft); color:var(--accent-strong); border-color:transparent; }
    main.content{ padding:18px 16px 48px; }
    .brand-text .t2{ display:none; }
  }

  .page-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .page-head h1{ font-size:20px; font-weight:700; }
  .page-head .sub{ color:var(--text-muted); font-size:13px; }

  .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px; }
  @media (max-width:640px){ .stat-grid{ grid-template-columns:repeat(2,1fr); } }
  .stat-tile{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; position:relative; overflow:hidden; }
  .stat-tile::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--stripe, var(--accent)); }
  .stat-tile .num{ font-family:"IBM Plex Mono"; font-size:26px; font-weight:600; line-height:1; }
  .stat-tile .lbl{ margin-top:6px; font-size:12px; color:var(--text-muted); font-weight:500; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; }
  .section-title{ font-size:13px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin:0 0 10px 2px; }

  .case-list{ display:flex; flex-direction:column; gap:8px; }
  .case-row{
    display:flex; align-items:center; gap:14px; padding:12px 14px; background:var(--surface); border:1px solid var(--border);
    border-left:3px solid var(--stripe,var(--border)); border-radius:10px; cursor:pointer;
  }
  .case-row:hover{ border-color:var(--accent); }
  .case-row .refid{ font-size:11.5px; color:var(--text-muted); flex:none; width:96px; }
  .case-row .main{ flex:1; min-width:0; }
  .case-row .title{ font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .case-row .meta{ margin-top:3px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .case-row .meta .muted{ font-size:12px; color:var(--text-muted); }
  .case-row .side{ flex:none; display:flex; align-items:center; gap:10px; }

  .att-row{
    display:flex; align-items:center; gap:16px; padding:12px 14px; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; flex-wrap:wrap;
  }
  .att-row .name{ flex:none; width:100px; font-weight:600; font-size:13.5px; }
  .att-row .main{ flex:1; min-width:0; display:flex; gap:26px; flex-wrap:wrap; }
  .att-row .seg-time{ font-size:12px; line-height:1.4; }
  .att-row .seg-time span{ display:block; color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:0.04em; }
  .att-row .seg-time b{ font-weight:600; font-size:13px; }
  .att-row .seg-time a{ font-weight:600; }
  .att-row .side{ flex:none; }

  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap; }
  .pill .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill-category{ background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border); font-weight:500; }

  .btn{ border:1px solid var(--border); background:var(--surface); color:var(--text); padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn:hover{ border-color:var(--accent); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn.ghost{ background:none; border-color:transparent; }
  .btn.ghost:hover{ background:var(--surface-2); border-color:var(--border); }
  .btn.small{ padding:6px 11px; font-size:12.5px; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .empty-state{
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:52px 24px;
    color:var(--text-muted); border:1px dashed var(--border); border-radius:14px; background:var(--surface-2);
  }
  .empty-state svg{ color:var(--accent); opacity:0.8; }
  .empty-state h3{ color:var(--text); font-size:15px; }

  .form-card{ max-width:640px; padding:22px; display:flex; flex-direction:column; gap:16px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12.5px; font-weight:600; color:var(--text-muted); }
  .field input[type="text"], .field textarea, .field select{
    font-family:inherit; font-size:13.5px; color:var(--text); background:var(--surface-2);
    border:1px solid var(--border); border-radius:8px; padding:9px 11px; width:100%;
  }
  .field textarea{ resize:vertical; min-height:80px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:520px){ .row2{ grid-template-columns:1fr; } }
  .seg{ display:flex; gap:6px; flex-wrap:wrap; }
  .seg button{ border:1px solid var(--border); background:var(--surface-2); color:var(--text); padding:7px 12px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .seg button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }

  .filter-bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .filter-bar input[type="text"], .filter-bar select{
    font-family:inherit; font-size:13px; padding:7px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text);
  }
  .filter-bar input[type="text"]{ min-width:180px; flex:1; }

  .overlay{
    position:fixed; inset:0; background:rgba(20,18,14,0.5); backdrop-filter:blur(2px);
    display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:100; overflow-y:auto;
  }
  .modal{ background:var(--surface); border-radius:16px; width:100%; max-width:560px; box-shadow:var(--shadow); border:1px solid var(--border); }
  .modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:18px 20px; border-bottom:1px solid var(--border); }
  .modal-body{ padding:18px 20px; display:flex; flex-direction:column; gap:16px; }
  .detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 18px; }
  @media (max-width:480px){ .detail-grid{ grid-template-columns:1fr; } }
  .kv .k{ font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-muted); font-weight:600; }
  .kv .v{ font-size:13.5px; margin-top:2px; }
  .timeline{ display:flex; flex-direction:column; gap:0; border-top:1px solid var(--border); }
  .tl-item{ display:flex; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .tl-item .tl-dot{ width:8px; height:8px; border-radius:50%; margin-top:5px; flex:none; background:var(--accent); }
  .tl-item .tl-body{ flex:1; min-width:0; }
  .tl-item .tl-top{ display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .tl-item .tl-actor{ font-weight:600; font-size:12.5px; }
  .tl-item .tl-time{ font-size:11px; color:var(--text-muted); }
  .tl-item .tl-note{ margin-top:2px; font-size:13px; color:var(--text); }

  .toast-wrap{ position:fixed; bottom:18px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:200; }
  .toast{ background:var(--text); color:var(--bg); padding:10px 16px; border-radius:9px; font-size:13px; box-shadow:var(--shadow); max-width:320px; }

  .id-card{
    display:flex; flex-direction:row; align-items:center; gap:12px; text-align:left; border:1.5px solid var(--border);
    border-radius:12px; padding:12px 14px; cursor:pointer; background:var(--surface-2); width:100%; box-sizing:border-box;
  }
  .id-card .id-card-text{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .id-card.on{ border-color:var(--accent); background:var(--accent-soft); }
  .id-card b{ font-size:13.5px; }
  .id-card span{ font-size:11.5px; color:var(--text-muted); }
  .gate-error{ font-size:12.5px; color:var(--pri-urgent); }
  .gate-hint{ font-size:11.5px; color:var(--text-muted); }

  .bell-pop{
    position:absolute; top:44px; right:20px; width:320px; max-width:calc(100vw - 32px); background:var(--surface);
    border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); z-index:50; overflow:hidden;
  }
  .bell-pop .bp-head{ padding:12px 14px; border-bottom:1px solid var(--border); font-weight:600; font-size:13px; }
  .bell-pop .bp-list{ max-height:320px; overflow-y:auto; }
  .bell-pop .bp-item{ padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer; }
  .bell-pop .bp-item:hover{ background:var(--surface-2); }
  .bell-pop .bp-item .t{ font-weight:600; font-size:12.5px; }
  .bell-pop .bp-item .m{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }
  .bell-pop .bp-empty{ padding:22px 14px; text-align:center; color:var(--text-muted); font-size:12.5px; }

  .banner{ padding:10px 14px; border-radius:10px; background:var(--pri-high-bg); color:var(--pri-high); font-size:13px; margin-bottom:16px; }

  input[type="file"]{ font-family:inherit; font-size:12.5px; color:var(--text-muted); }
  .attach-list{ display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
  .attach-chip{ position:relative; width:76px; }
  .attach-chip img{ width:76px; height:76px; object-fit:cover; border-radius:8px; border:1px solid var(--border); display:block; }
  .attach-video{ width:76px; height:76px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--text-muted); }
  .attach-name{ display:block; font-size:10px; color:var(--text-muted); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .attach-remove{
    position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:var(--text); color:var(--bg);
    border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  }
  .proof-grid{ display:flex; gap:10px; flex-wrap:wrap; }
  .proof-grid img{ width:160px; height:160px; max-width:100%; border-radius:10px; border:1px solid var(--border); object-fit:cover; display:block; }
  .proof-grid video{ width:220px; max-width:100%; height:160px; border-radius:10px; border:1px solid var(--border); display:block; background:#000; object-fit:contain; }
</style>
</head>

<script>
(function(){

  function genClientId(role){
    const prefix = role==='hut' ? 'HUT' : 'NSK';
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s=''; for(let i=0;i<4;i++) s += chars[Math.floor(Math.random()*chars.length)];
    return prefix+'-'+s;
  }

  // access to cases and meetings, and are never offered as an "assign to" / "requested engineer" option.
  const DCT_VIEWERS = ['Rajitha'];
  const DCT_STAFF = ENGINEERS.concat(DCT_VIEWERS);

  // platform capability), so precise browser geolocation is best-effort only and can silently fail —
  // the self-picked location below is what's actually guaranteed to be recorded every time.
  const LOCATION_OPTIONS = ['Norrsken House','The Hut Hotel','DCT Office','Remote / Other'];
  function engineerOptions(selected, placeholder){
    return '<option value="" '+(!selected?'selected':'')+'>'+(placeholder||'No preference — anyone available')+'</option>' +
      ENGINEERS.map(n=>'<option '+(selected===n?'selected':'')+'>'+n+'</option>').join('');
  }

  const DURATIONS = [15,30,45,60,90];
  const MEETING_STATUS_FLOW = { Requested:'Confirmed', Confirmed:'Completed' };
  const MEETING_STATUS_ACTION_LABEL = { Requested:'Confirm meeting', Confirmed:'Mark completed' };
  function meetingStatusMeta(s){
    return {
      Requested:{label:'Requested', c:'var(--status-open)', bg:'var(--status-open-bg)'},
      Confirmed:{label:'Confirmed', c:'var(--status-progress)', bg:'var(--status-progress-bg)'},
      Completed:{label:'Completed', c:'var(--status-resolved)', bg:'var(--status-resolved-bg)'},
      Declined:{label:'Declined', c:'var(--status-closed)', bg:'var(--status-closed-bg)'},
      Cancelled:{label:'Cancelled', c:'var(--status-closed)', bg:'var(--status-closed-bg)'}
    }[s] || {label:s, c:'var(--text-muted)', bg:'var(--surface-2)'};
  }
  function fmtMeetingWhen(m){
    if(!m.date) return '—';
    const d = new Date(m.date+'T'+(m.time||'00:00')+':00');
    const dateStr = isNaN(d) ? m.date : d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
    const timeStr = m.time || '';
    return dateStr + (timeStr ? (' · '+timeStr) : '') + (m.durationMinutes ? (' · '+m.durationMinutes+'min') : '');
  }

  function statusMeta(s){
    return {
      Open:{label:'Open', c:'var(--status-open)', bg:'var(--status-open-bg)'},
      'In Progress':{label:'In Progress', c:'var(--status-progress)', bg:'var(--status-progress-bg)'},
      Resolved:{label:'Resolved', c:'var(--status-resolved)', bg:'var(--status-resolved-bg)'},
      Closed:{label:'Closed', c:'var(--status-closed)', bg:'var(--status-closed-bg)'}
    }[s] || {label:s, c:'var(--text-muted)', bg:'var(--surface-2)'};
  }
  function priMeta(p){
    return {
      Urgent:{c:'var(--pri-urgent)', bg:'var(--pri-urgent-bg)'},
      High:{c:'var(--pri-high)', bg:'var(--pri-high-bg)'},
      Medium:{c:'var(--pri-medium)', bg:'var(--pri-medium-bg)'},
      Low:{c:'var(--pri-low)', bg:'var(--pri-low-bg)'}
    }[p] || {c:'var(--text-muted)', bg:'var(--surface-2)'};
  }
  function instMeta(name){
    return name==='The Hut Hotel'
      ? {c:'var(--inst-hut)', bg:'var(--inst-hut-bg)'}
      : {c:'var(--inst-norrsken)', bg:'var(--inst-norrsken-bg)'};
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function fmtRelative(iso){
    const d = new Date(iso); const now = Date.now();
    const diff = Math.max(0, now - d.getTime());
    const m = Math.floor(diff/60000);
    if(m < 1) return 'just now';
    if(m < 60) return m+'m ago';
    const h = Math.floor(m/60);
    if(h < 24) return h+'h ago';
    const dys = Math.floor(h/24);
    if(dys < 7) return dys+'d ago';
    return d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
  }
  function fmtFull(iso){
    if(!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}) + ' · ' +
           d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
  }
  function isToday(iso){
    if(!iso) return false;
    const d = new Date(iso), n = new Date();
    return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
  }
  function fmtTimeOnly(iso){
    if(!iso) return '—';
    return new Date(iso).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
  }
  function mapLink(lat,lng){
    if(lat==null || lng==null) return '';
    return 'https://www.google.com/maps?q='+lat+','+lng;
  }
  function todayKey(d){
    d = d || new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  // A plain browser download needs no external service — always available once the page has loaded.
  function saveTextFile(filename, text, mime){
    try{
      const blob = new Blob([text], { type: mime || 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 4000);
      return true;
    }catch(e){ console.error('download failed', e); return false; }
  }

  // Attachments go to Cloudinary (free, no card required) instead of Claude's assets capability
  // or Firebase Storage (which now requires a billing account).
  function uploadAsset(file){
    const url = 'https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD_NAME + '/auto/upload';
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    return fetch(url, { method: 'POST', body: form })
      .then(res => res.json().then(json => {
        if(!res.ok){ throw new Error((json && json.error && json.error.message) || ('Upload failed (' + res.status + ')')); }
        return json;
      }))
      .then(json => ({
        id: json.public_id, url: json.secure_url, contentType: file.type, sizeBytes: file.size, name: file.name
      }));
  }

  function filteredCases(){
    const f = state.filters;

    if(f.status!=='all') list = list.filter(c=>c.status===f.status);
    if(f.category!=='all') list = list.filter(c=>c.category===f.category);
    if(f.priority!=='all') list = list.filter(c=>c.priority===f.priority);
    if(f.institution!=='all') list = list.filter(c=>c.institution===f.institution);
    if(f.q.trim()){
      const q = f.q.trim().toLowerCase();
      list = list.filter(c => (c.title||'').toLowerCase().includes(q) || (c.description||'').toLowerCase().includes(q) || (c.refId||'').toLowerCase().includes(q) || (c.reportedBy||'').toLowerCase().includes(q) || (c.reportedByClientId||'').toLowerCase().includes(q));
    }
    if(f.sort==='newest') list.sort((a,b)=> new Date(b.reportedAt)-new Date(a.reportedAt));
    else if(f.sort==='oldest') list.sort((a,b)=> new Date(a.reportedAt)-new Date(b.reportedAt));
    else if(f.sort==='priority') list.sort((a,b)=> PRI_RANK[a.priority]-PRI_RANK[b.priority] || new Date(a.reportedAt)-new Date(b.reportedAt));

  /* ---------------- mutations ---------------- */
  function historyEntry(action, note){

  }

  function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

  // A single running count shared by every case (or every meeting), both buildings — ...M00001, ...M00002, ...
  // A Firestore transaction (read-then-write, retried automatically by the SDK on conflict) makes sure
  // two people submitting at the same moment never get the same number.
  async function nextSequence(counterPath){
    const counterRef = db.doc(counterPath);
    return db.runTransaction(async (tx) => {
      const snap = await tx.get(counterRef);
      let current = 0;
      if(snap.exists){
        const d = snap.data();
        if(d && typeof d.value === 'number') current = d.value;
      }
      const next = current + 1;
      tx.set(counterRef, { value: next, updatedAt: new Date().toISOString() });
      return next;
    });
  }
  function nextCaseNumber(){ return nextSequence('meta/counter'); }
  function nextMeetingNumber(){ return nextSequence('meta/meetingCounter'); }

  async function createCase(data){
    if(!db){ toast("Can't reach the shared database right now — nothing was saved."); return; }
    state.submitting = true; render();

      refId = 'DCT-M' + String(seq).padStart(5,'0');
    }catch(e){
      state.submitting = false; render();
      toast("Couldn't generate a case number — please try again.");
      return;
    }
    const ref = db.collection('cases').doc();
    const now = new Date().toISOString();
    const wantsEngineer = data.requestedEngineer && data.requestedEngineer.trim();
    const createdNote = wantsEngineer ? ('Case logged. Requested engineer: '+data.requestedEngineer+'.') : 'Case logged.';
    const doc = Object.assign({}, data, {
      refId, status:'Open', reportedAt: now, updatedAt: now,
      assignedTo:'', resolvedAt:null, resolutionNotes:'', closingRemark:'',
      history:[ historyEntry('created', createdNote) ]
    });
    try{
      await ref.set(doc);
      if(!isStaff() && wantsEngineer){
        toast("Case "+refId+" sent to "+data.requestedEngineer+" — the whole DCT team has been notified too.");

      }
      state.view = isStaff() ? 'dashboard' : 'status';
      state.formDraft = null;
      state.submitting = false;
      render();
    }catch(e){
      state.submitting = false;
      toast('Could not save case ('+e.code+').');

  }

  function viewerDenied(){ toast('Your account has view-only access.'); }
  function advanceStatus(c, note){
    if(isViewer()){ viewerDenied(); return; }
    const next = STATUS_FLOW[c.status];
    if(!next) return;
    const patch = { status: next, history: c.history.concat([ historyEntry('status_changed', (note&&note.trim()) || ('Moved to '+next+'.')) ]) };
    if(next==='Resolved'){ patch.resolvedAt = new Date().toISOString(); if(note && note.trim()) patch.resolutionNotes = note.trim(); }
    if(next==='Closed' && note && note.trim()){ patch.closingRemark = note.trim(); }
    updateCase(c.id, patch).then(()=> toast('Case '+c.refId+' → '+next+'.'));
  }
  function reopenCase(c, note){
    if(isViewer()){ viewerDenied(); return; }
    const patch = { status:'Open', resolvedAt:null, history: c.history.concat([ historyEntry('reopened', (note&&note.trim()) || 'Reopened.') ]) };
    updateCase(c.id, patch).then(()=> toast('Case '+c.refId+' reopened.'));

  /* ---------------- attendance ----------------
     Check-in/out always records a name, date and time. The location is captured LIVE from the
     device's own GPS/network location the moment they tap Check in / Check out — that's the
     primary, automatic path and needs no typing from them. Manual location selection only ever
     shows up as a fallback, and only if this device's live location genuinely could not be read
     (permission blocked, GPS off, etc.) — so check-in never dead-ends even then. */
  function ensureAttendanceDraft(){
    if(!state.attendanceLocationDraft) state.attendanceLocationDraft = LOCATION_OPTIONS[0];
    return state.attendanceLocationDraft;
  }
  function tryGetLocation(timeoutMs){
    timeoutMs = timeoutMs || 10000;
    return new Promise((resolve)=>{
      if(!navigator.geolocation){ resolve(null); return; }
      let done = false;
      const finish = (val)=>{ if(done) return; done = true; resolve(val); };
      setTimeout(()=> finish(null), timeoutMs);
      try{
        navigator.geolocation.getCurrentPosition(
          pos => finish({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
          ()  => finish(null),
          { enableHighAccuracy:true, timeout:timeoutMs, maximumAge:0 }
        );
      }catch(e){ finish(null); }
    });
  }
  async function attemptCheckIn(){
    if(!canTrackAttendance()) return;
    if(!db){ toast("Can't reach the shared database right now — try again in a moment."); return; }
    if(myAttendanceToday()){ toast('You already checked in today.'); return; }
    state.attendanceStage = 'locating'; state.attendanceBusy = true; render();
    const loc = await tryGetLocation();
    if(loc){ await finishCheckIn(loc, 'Live location'); }
    else { state.attendanceStage = 'fallback'; state.attendanceBusy = false; render(); }
  }
  async function finishCheckIn(loc, locationLabel){
    const date = todayKey();
    const id = attendanceDocId(state.identity.name, date);
    const now = new Date().toISOString();
    try{
      await db.doc('attendance/'+id).set({
        name: state.identity.name, date, status:'Present',
        checkInAt: now, checkInLocation: locationLabel,
        checkInLat: loc?loc.lat:null, checkInLng: loc?loc.lng:null,
        checkOutAt: null, checkOutLocation: '', checkOutLat: null, checkOutLng: null,
        updatedAt: now
      });
      toast('Checked in at '+fmtTimeOnly(now)+(loc?' with your live location.':' — '+locationLabel+'.'));
      state.attendanceStage = null; state.attendanceLocationDraft = null;
    }catch(e){ toast('Check-in failed ('+(e&&e.code)+').'); }
    state.attendanceBusy = false; render();
  }
  function checkInWithFallback(locationLabel){
    if(!locationLabel){ toast('Please choose your location.'); return; }
    state.attendanceBusy = true; render();
    finishCheckIn(null, locationLabel);
  }
  async function attemptCheckOut(){
    if(!canTrackAttendance()) return;
    const rec = myAttendanceToday();
    if(!rec){ toast('Check in first.'); return; }
    if(rec.checkOutAt){ toast('You already checked out today.'); return; }
    if(!db){ toast("Can't reach the shared database right now — try again in a moment."); return; }
    state.attendanceStage = 'locating'; state.attendanceBusy = true; render();
    const loc = await tryGetLocation();
    if(loc){ await finishCheckOut(rec, loc, 'Live location'); }
    else { state.attendanceStage = 'fallback'; state.attendanceBusy = false; render(); }
  }
  async function finishCheckOut(rec, loc, locationLabel){
    const now = new Date().toISOString();
    try{
      await db.doc('attendance/'+rec.id).update({
        checkOutAt: now, checkOutLocation: locationLabel,
        checkOutLat: loc?loc.lat:null, checkOutLng: loc?loc.lng:null,
        updatedAt: now
      });
      toast('Checked out at '+fmtTimeOnly(now)+(loc?' with your live location.':' — '+locationLabel+'.'));
      state.attendanceStage = null; state.attendanceLocationDraft = null;
    }catch(e){ toast('Check-out failed ('+(e&&e.code)+').'); }
    state.attendanceBusy = false; render();
  }
  function checkOutWithFallback(locationLabel){

    const rec = myAttendanceToday();

    state.attendanceBusy = true; render();

  function exportCsv(list){
    if(!state.downloads) return toast('Export is unavailable in this view.');
    const cols = ['refId','institution','title','category','priority','status','reportedBy','reportedByRole','reportedByClientId','requestedEngineer','location','reportedAt','assignedTo','resolvedAt','resolutionNotes','closingRemark','attachmentCount'];
    const rows = [cols.join(',')].concat(list.map(c => cols.map(k=>{
      let v = k==='attachmentCount' ? String((c.attachments||[]).length) : (c[k]==null? '' : String(c[k]));
      v = v.replace(/"/g,'""');
      return /[",\n]/.test(v) ? '"'+v+'"' : v;
    }).join(',')));
    const csv = rows.join('\n');
    if(saveTextFile('support-cases-'+new Date().toISOString().slice(0,10)+'.csv', csv)) toast('Export saved.');
    else toast('Export failed — your browser blocked the download.');
  }

    if(!state.identity) return '';
    const banner = state.dbAvailable===false
      ? (!firebaseReady
          ? '<div class="banner">This copy of the app isn\'t connected to a database yet. Open the file, find <b>firebaseConfig</b> near the top, and paste in your Firebase project\'s values — see the setup guide for exactly where to find them.</div>'
          : '<div class="banner">Can\'t reach the shared database right now. Browsing works, but new cases and updates won\'t be saved until the connection is back.</div>')
      : '';
    if(isStaff()){
      if(state.view==='all') return banner + renderAllCases();
      if(state.view==='meetings') return banner + renderMeetingsView();
      if(state.view==='newMeeting') return banner + renderNewMeetingPage();
      if(state.view==='attendance') return banner + renderAttendanceView();
      return banner + renderDashboard();
    }
    if(state.view==='status') return banner + renderClientStatus();
    if(state.view==='connection') return banner + renderClientConnection();
    return banner + renderClientReport();
  }

  /* ---------------- dashboard (DCT) ---------------- */
  function renderDashboard(){
    const cases = state.cases;
    const openN = cases.filter(c=>c.status==='Open').length;
    const progN = cases.filter(c=>c.status==='In Progress').length;
    const resolvedToday = cases.filter(c=>c.status!=='Open' && c.status!=='In Progress' && isToday(c.resolvedAt)).length;
    const total = cases.length;
    const active = activeCases();

    return '<div class="page-head"><div><h1>Dashboard</h1><div class="sub">What needs attention right now, across both buildings</div></div></div>' +
      '<div class="stat-grid">' +
        statTile(openN,'Open','var(--status-open)') +
        statTile(progN,'In progress','var(--status-progress)') +
        statTile(resolvedToday,'Resolved today','var(--status-resolved)') +
        statTile(total,'Total logged','var(--accent)') +
      '</div>' +
      '<div class="section-title">By institution</div>' +
      '<div class="stat-grid" style="grid-template-columns:repeat(2,1fr)">' +
        instTile('Norrsken House', cases) + instTile('The Hut Hotel', cases) +
      '</div>' +
      '<div class="section-title">Needs attention ('+active.length+')</div>' +
      (active.length===0 ?
        '<div class="empty-state">'+ICONS.check+'<h3>All caught up</h3><div>No open or in-progress cases right now.</div></div>' :
        '<div class="case-list">' + active.map(c=>renderCaseRow(c)).join('') + '</div>');

  function statTile(num,label,color){

  function instTile(name, cases){

        actionBlock = '<div class="card" style="padding:20px;display:flex;flex-direction:column;gap:12px;max-width:440px">' +
          '<div style="font-size:14.5px"><b>You haven\'t checked in today.</b></div>' +
          '<div style="font-size:12px;color:var(--text-muted)">Tapping Check in asks this device for its live location and saves it along with the time.</div>' +

        actionBlock = '<div class="card" style="padding:20px;display:flex;flex-direction:column;gap:10px;max-width:440px">' +
          checkedInHead +
          '<div style="font-size:14.5px;margin-top:6px"><b>Getting this device\'s live location…</b></div>' +
        '</div>';
      } else if(stage==='fallback'){
        actionBlock = '<div class="card" style="padding:20px;display:flex;flex-direction:column;gap:14px;max-width:440px">' +

          '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost small" id="attRetryLocBtn">Try live location again</button></div>' +

        '</div>';

        actionBlock = '<div class="card" style="padding:20px;display:flex;flex-direction:column;gap:14px;max-width:440px">' +
          checkedInHead +

        '<div style="font-size:12.5px;color:var(--text-muted)">Out: '+fmtTimeOnly(rec.checkOutAt)+' · '+esc(rec.checkOutLocation||'—')+(rec.checkOutLat!=null?' (<a href="'+mapLink(rec.checkOutLat,rec.checkOutLng)+'" target="_blank" rel="noopener">map</a>)':'')+'</div>' +

  function attendanceMonthOptions(){
    const months = Array.from(new Set(state.attendance.map(a=>a.date.slice(0,7))));
    months.sort().reverse();
    return months;
  }
  function fmtMonthLabel(ym){
    const d = new Date(ym+'-01T00:00:00');
    return isNaN(d) ? ym : d.toLocaleDateString(undefined,{year:'numeric', month:'long'});
  }
  function renderAttendanceLog(){
    const f = state.attendanceFilter;
    let list = state.attendance.slice();
    if(f.person!=='all') list = list.filter(a=>a.name===f.person);
    if(f.month!=='all') list = list.filter(a=>a.date.slice(0,7)===f.month);
    list.sort((a,b)=> b.date.localeCompare(a.date) || (a.name<b.name?-1:1));
    const months = attendanceMonthOptions();
    return '<div class="page-head"><div><h1>Attendance</h1><div class="sub">Check-in / check-out log for Abhishek, Eugen, Fillette and Ernest — visible only to you and Mahesh. Every day is kept, so at month end you can filter to that month and export it.</div></div></div>' +
      '<div class="filter-bar">' +
        '<select id="attFilterName"><option value="all" '+(f.person==='all'?'selected':'')+'>Everyone</option>' +
          ATTENDANCE_TRACKED.map(n=>'<option '+(f.person===n?'selected':'')+'>'+esc(n)+'</option>').join('') +
        '</select>' +
        '<select id="attFilterMonth"><option value="all" '+(f.month==='all'?'selected':'')+'>All months</option>' +
          months.map(m=>'<option value="'+m+'" '+(f.month===m?'selected':'')+'>'+fmtMonthLabel(m)+'</option>').join('') +
        '</select>' +
        '<button class="btn small" id="attExportBtn" style="margin-left:auto">Export CSV</button>' +
      '</div>' +
      (list.length===0 ?
        '<div class="empty-state">'+ICONS.clock+'<h3>No attendance recorded</h3><div>Check-ins by the team will show up here.</div></div>' :
        '<div class="case-list">' + list.map(a=>renderAttRow(a,true)).join('') + '</div>');
  }
  function exportAttendanceCsv(list){
    if(!canViewAttendance()) return;
    if(!state.downloads) return toast('Export is unavailable in this view.');
    const cols = ['name','date','status','checkInAt','checkInLocation','checkInLat','checkInLng','checkOutAt','checkOutLocation','checkOutLat','checkOutLng'];
    const rows = [cols.join(',')].concat(list.map(a => cols.map(k=>{
      let v = a[k]==null ? '' : String(a[k]);
      v = v.replace(/"/g,'""');
      return /[",\n]/.test(v) ? '"'+v+'"' : v;
    }).join(',')));
    const csv = rows.join('\n');
    const monthPart = state.attendanceFilter.month!=='all' ? state.attendanceFilter.month : 'all-months';
    if(saveTextFile('attendance-'+monthPart+'-'+new Date().toISOString().slice(0,10)+'.csv', csv)) toast('Attendance export saved — open it in Excel or Google Sheets.');
    else toast('Export failed — your browser blocked the download.');
  }

  /* ---------------- events ---------------- */
  function wireEvents(){
    document.querySelectorAll('[data-nav]').forEach(el=> el.addEventListener('click', ()=>{ state.view = el.getAttribute('data-nav'); state.bellOpen=false; render(); }));

    const bellBtn = document.getElementById('bellBtn');
    if(bellBtn) bellBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      state.bellOpen = !state.bellOpen;
      if(state.bellOpen){ state.lastSeenAt = Date.now(); try{ localStorage.setItem('nsd_lastSeen', String(state.lastSeenAt)); }catch(err){} }
      render();
    });
    const bellPop = document.getElementById('bellPop');
    if(bellPop) bellPop.addEventListener('click', (e)=> e.stopPropagation());
    document.querySelectorAll('#bellPop [data-open]').forEach(el=> el.addEventListener('click', ()=>{ state.detailId = el.getAttribute('data-open'); state.bellOpen=false; render(); }));
    document.querySelectorAll('#bellPop [data-open-meeting]').forEach(el=> el.addEventListener('click', ()=>{ state.meetingDetailId = el.getAttribute('data-open-meeting'); state.bellOpen=false; render(); }));
    if(state.bellOpen) document.addEventListener('click', function h(){ state.bellOpen=false; render(); document.removeEventListener('click',h); }, {once:true});

    const idChip = document.getElementById('idChipBtn');
    if(idChip) idChip.addEventListener('click', ()=>{ state.identityModal = true; state.gatePendingRole = state.identity.role; state.gateError=''; state.gateCode=''; state.gateName=''; render(); });
    const closeIdModal = document.getElementById('closeIdModal');
    if(closeIdModal) closeIdModal.addEventListener('click', ()=>{ state.identityModal = false; state.gatePendingRole=null; state.gateError=''; state.gateCode=''; state.gateName=''; render(); });

    document.querySelectorAll('.id-card[data-role]').forEach(el=> el.addEventListener('click', ()=>{
      state.gatePendingRole = el.getAttribute('data-role');
      state.gateError = '';
      render();
      const codeEl = document.getElementById('gateCode'); if(codeEl) codeEl.focus();
    }));
    const gateCodeEl = document.getElementById('gateCode');
    if(gateCodeEl) gateCodeEl.addEventListener('input', ()=>{ state.gateCode = gateCodeEl.value; });
    const gateNameEl = document.getElementById('gateName');
    if(gateNameEl){
      gateNameEl.addEventListener('input', ()=>{ state.gateName = gateNameEl.value; });
      gateNameEl.addEventListener('change', ()=>{ state.gateName = gateNameEl.value; });
    }
    const saveIdBtn = document.getElementById('saveIdentity');
    if(saveIdBtn) saveIdBtn.addEventListener('click', ()=>{
      const role = state.gatePendingRole;
      const code = document.getElementById('gateCode').value.trim();
      const name = document.getElementById('gateName').value.trim();
      state.gateCode = code; state.gateName = name;
      if(!name){ state.gateError = 'Please select your name.'; render(); return; }
      if(code.toUpperCase() !== ACCESS[role].code.toUpperCase()){
        state.gateError = "That code doesn't match. Double-check with your DCT contact.";
        render(); return;
      }
      const prevIdentity = state.identity;
      const keepId = (state.identity && state.identity.role===role && state.identity.clientId) ? state.identity.clientId : null;
      const clientId = role==='dct' ? null : (keepId || genClientId(role));
      state.identity = clientId ? { role, name, clientId } : { role, name };
      try{ localStorage.setItem('nsd_identity_v2', JSON.stringify(state.identity)); }catch(e){}
      // A different person (or a different team) signing in should never inherit whatever the last
      // person was mid-typing — clear any in-progress case/meeting drafts so fields like "Reported by"
      // and "Your name" re-fill for the new identity instead of carrying the old one over.
      if(!prevIdentity || prevIdentity.role!==role || prevIdentity.name!==name){
        state.formDraft = null;
        state.meetingFormDraft = null;
      }
      state.identityModal = false; state.gatePendingRole = null; state.gateError = '';
      state.gateCode = ''; state.gateName = '';
      state.view = role==='dct' ? 'dashboard' : 'report';
      render();
    });

    document.querySelectorAll('[data-open]').forEach(el=>{
      if(el.closest('#bellPop')) return;
      el.addEventListener('click', ()=>{ state.detailId = el.getAttribute('data-open'); render(); });
    });
    document.querySelectorAll('[data-quick]').forEach(el=> el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const c = state.cases.find(x=>x.id===el.getAttribute('data-quick'));
      if(c) advanceStatus(c, '');
    }));

    document.querySelectorAll('[data-open-meeting]').forEach(el=>{
      if(el.closest('#bellPop')) return;
      el.addEventListener('click', ()=>{ state.meetingDetailId = el.getAttribute('data-open-meeting'); render(); });
    });
    document.querySelectorAll('[data-quick-meeting]').forEach(el=> el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const m = state.meetings.find(x=>x.id===el.getAttribute('data-quick-meeting'));
      if(m) advanceMeeting(m, '');
    }));

    const closeMeetingDetail = document.getElementById('closeMeetingDetail');
    if(closeMeetingDetail) closeMeetingDetail.addEventListener('click', ()=>{ state.meetingDetailId=null; render(); });
    const meetingOverlay = document.getElementById('meetingDetailOverlay');
    if(meetingOverlay) meetingOverlay.addEventListener('click', (e)=>{ if(e.target===meetingOverlay){ state.meetingDetailId=null; render(); } });

    document.querySelectorAll('[data-mact="advance"]').forEach(el=> el.addEventListener('click', ()=>{
      const m = state.meetings.find(x=>x.id===el.getAttribute('data-id'));
      if(!m) return;
      advanceMeeting(m, '');
      state.meetingDetailId = null; render();
    }));
    document.querySelectorAll('[data-mact="decline"]').forEach(el=> el.addEventListener('click', ()=>{
      const m = state.meetings.find(x=>x.id===el.getAttribute('data-id'));
      if(!m) return;
      const note = prompt('Reason for declining (optional)?','') || '';
      declineMeeting(m, note);
      state.meetingDetailId = null; render();
    }));
    document.querySelectorAll('[data-mact="cancel"]').forEach(el=> el.addEventListener('click', ()=>{
      const m = state.meetings.find(x=>x.id===el.getAttribute('data-id'));
      if(!m) return;
      const note = prompt('Reason for cancelling (optional)?','') || '';
      cancelMeeting(m, note);
      state.meetingDetailId = null; render();
    }));
    document.querySelectorAll('[data-mact="reopen"]').forEach(el=> el.addEventListener('click', ()=>{
      const m = state.meetings.find(x=>x.id===el.getAttribute('data-id'));
      if(!m) return;
      reopenMeeting(m, '');
      state.meetingDetailId = null; render();
    }));
    const meetingCommentBtn = document.getElementById('meetingCommentBtn');
    if(meetingCommentBtn) meetingCommentBtn.addEventListener('click', ()=>{
      const m = state.meetings.find(x=>x.id===meetingCommentBtn.getAttribute('data-id'));
      const inp = document.getElementById('meetingCommentInput');
      if(m) addMeetingComment(m, inp.value);
      if(inp) inp.value='';
    });

    const closeDetail = document.getElementById('closeDetail');
    if(closeDetail) closeDetail.addEventListener('click', ()=>{ state.detailId=null; render(); });
    const overlay = document.getElementById('detailOverlay');
    if(overlay) overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ state.detailId=null; render(); } });

    document.querySelectorAll('[data-act="advance"]').forEach(el=> el.addEventListener('click', ()=>{
      const c = state.cases.find(x=>x.id===el.getAttribute('data-id'));
      if(!c) return;
      let note = '';
      if(c.status==='In Progress'){ note = prompt('Resolution note (what fixed it)?','') || ''; }
      else if(c.status==='Resolved'){ const remarkEl = document.getElementById('closingRemarkInput'); note = remarkEl ? remarkEl.value : ''; }
      advanceStatus(c, note);
      state.detailId = null; render();
    }));
    document.querySelectorAll('[data-act="reopen"]').forEach(el=> el.addEventListener('click', ()=>{
      const c = state.cases.find(x=>x.id===el.getAttribute('data-id'));
      if(!c) return;
      const note = prompt('Why is this reopening?','') || '';
      reopenCase(c, note);
      state.detailId = null; render();
    }));
    const assignBtn = document.getElementById('assignBtn');
    if(assignBtn) assignBtn.addEventListener('click', ()=>{
      const c = state.cases.find(x=>x.id===assignBtn.getAttribute('data-id'));
      const val = document.getElementById('assignInput').value;
      if(c) assignCase(c, val);
    });
    const commentBtn = document.getElementById('commentBtn');
    if(commentBtn) commentBtn.addEventListener('click', ()=>{
      const c = state.cases.find(x=>x.id===commentBtn.getAttribute('data-id'));
      const inp = document.getElementById('commentInput');
      if(c) addComment(c, inp.value);
      if(inp) inp.value='';
    });

    /* new case form (DCT + client share the same wiring; DCT has an institution seg, client doesn't) */
    const instSeg = document.getElementById('fInstSeg');
    if(instSeg) instSeg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{
      instSeg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      ensureFormDraft().institution = b.getAttribute('data-inst');
    }));
    const priSeg = document.getElementById('fPriSeg');
    if(priSeg) priSeg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{
      priSeg.querySelectorAll('button').forEach(x=>{ x.classList.remove('on'); x.style.background=''; x.style.borderColor=''; x.style.color=''; });
      b.classList.add('on'); const p = b.getAttribute('data-pri'); const m = priMeta(p);
      b.style.background = m.c; b.style.borderColor = m.c; b.style.color = '#fff';
      ensureFormDraft().priority = p;
    }));
    const bindDraftText = (id,key)=>{ const el=document.getElementById(id); if(el) el.addEventListener('input', ()=>{ ensureFormDraft()[key]=el.value; }); };
    bindDraftText('fReportedBy','reportedBy'); bindDraftText('fTitle','title'); bindDraftText('fDesc','description'); bindDraftText('fLocation','location');
    const bindDraftSelect = (id,key)=>{ const el=document.getElementById(id); if(el) el.addEventListener('change', ()=>{ ensureFormDraft()[key]=el.value; }); };
    bindDraftSelect('fCategory','category'); bindDraftSelect('fEngineer','requestedEngineer');

    const fAttach = document.getElementById('fAttach');
    if(fAttach) fAttach.addEventListener('change', async ()=>{
      const files = Array.from(fAttach.files || []);
      fAttach.value = '';
      const okTypes = ['image/png','image/jpeg','image/gif','image/webp','video/mp4','video/webm'];
      for(const file of files){
        const draft = ensureFormDraft();
        if(draft.attachments.length >= 4){ toast('You can attach up to 4 files per case.'); break; }
        if(file.size > 20*1024*1024){ toast(file.name+' is over 20MB — try a smaller file.'); continue; }
        if(!okTypes.includes(file.type)){ toast(file.name+" isn't a supported type — use JPG, PNG, GIF, WEBP, MP4 or WEBM."); continue; }
        if(!state.assetsApi){ toast('Attachments are unavailable in this view.'); break; }
        state.uploading = true; render();
        try{
          const res = await uploadAsset(file);
          ensureFormDraft().attachments.push({ id:res.id, url:res.url, contentType:res.contentType, name:file.name, sizeBytes:res.sizeBytes });
        }catch(err){ toast('Could not attach '+file.name+' ('+(err&&err.message)+').'); }
        state.uploading = false;
        render();
      }
    });
    document.querySelectorAll('[data-remove-attach]').forEach(el=> el.addEventListener('click', ()=>{
      const idx = parseInt(el.getAttribute('data-remove-attach'),10);
      const draft = ensureFormDraft();
      const removed = draft.attachments.splice(idx,1)[0];
      render();
      if(removed && state.assetsApi) deleteAsset(removed);
    }));

    const form = document.getElementById('newCaseForm');
    if(form) form.addEventListener('submit', (e)=>{
      e.preventDefault();
      const draft = ensureFormDraft();
      const title = (draft.title||'').trim();
      if(!title){ toast('Please add a short title.'); return; }
      const institution = isStaff() ? draft.institution : myInstitution();
      createCase({
        institution,
        title,
        description: (draft.description||'').trim(),
        category: draft.category,
        priority: draft.priority,
        location: (draft.location||'').trim(),
        reportedBy: (draft.reportedBy||'').trim() || state.identity.name,
        reportedByRole: isStaff() ? 'DCT' : 'Client',
        reportedByClientId: isStaff() ? '' : (state.identity.clientId || ''),
        requestedEngineer: draft.requestedEngineer || '',
        attachments: draft.attachments.slice()
      });
    });

    /* meeting form (DCT + client share the same wiring; DCT has an institution seg, client doesn't) */
    const mInstSeg = document.getElementById('mInstSeg');
    if(mInstSeg) mInstSeg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{
      mInstSeg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      ensureMeetingDraft().institution = b.getAttribute('data-inst');
    }));
    const bindMeetingText = (id,key)=>{ const el=document.getElementById(id); if(el) el.addEventListener('input', ()=>{ ensureMeetingDraft()[key]=el.value; }); };
    bindMeetingText('mRequestedBy','requestedBy'); bindMeetingText('mPurpose','purpose'); bindMeetingText('mDate','date'); bindMeetingText('mTime','time');
    const mDurationEl = document.getElementById('mDuration');
    if(mDurationEl) mDurationEl.addEventListener('change', ()=>{ ensureMeetingDraft().durationMinutes = parseInt(mDurationEl.value,10); });
    const mEngSeg = document.getElementById('mEngSeg');
    if(mEngSeg) mEngSeg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{
      const name = b.getAttribute('data-eng');
      const draft = ensureMeetingDraft();
      const idx = draft.engineers.indexOf(name);
      if(idx>=0){ draft.engineers.splice(idx,1); b.classList.remove('on'); }
      else { draft.engineers.push(name); b.classList.add('on'); }
    }));
    const meetingForm = document.getElementById('newMeetingForm');
    if(meetingForm) meetingForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const draft = ensureMeetingDraft();
      if(!draft.date || !draft.time){ toast('Please pick a date and time.'); return; }
      const institution = isStaff() ? draft.institution : myInstitution();
      createMeeting({
        institution,
        purpose: (draft.purpose||'').trim(),
        date: draft.date,
        time: draft.time,
        durationMinutes: draft.durationMinutes || 30,
        engineers: draft.engineers.slice(),
        requestedBy: (draft.requestedBy||'').trim() || state.identity.name,
        requestedByRole: isStaff() ? 'DCT' : 'Client',
        requestedByClientId: isStaff() ? '' : (state.identity.clientId || '')
      });
    });

    /* DCT: meetings filters */
    bindSelect('mInstitution', state.meetingFilters, 'institution'); bindSelect('mStatus2', state.meetingFilters, 'status');
    /* client: meeting filter */
    bindSelect('mStatus', state.clientMeetingFilter, 'status');

    /* DCT: all cases filters */
    const fq = document.getElementById('fq');
    if(fq) fq.addEventListener('input', ()=>{ state.filters.q = fq.value; render(); const el=document.getElementById('fq'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length);} });
    bindSelect('fInstitution', state.filters, 'institution'); bindSelect('fStatus', state.filters, 'status');
    bindSelect('fCategory2', state.filters, 'category'); bindSelect('fPriority2', state.filters, 'priority'); bindSelect('fSort', state.filters, 'sort');
    const exportBtn = document.getElementById('exportBtn');
    if(exportBtn) exportBtn.addEventListener('click', ()=> exportCsv(filteredCases()));

    /* client: status filters */
    const cq = document.getElementById('cq');
    if(cq) cq.addEventListener('input', ()=>{ state.clientFilter.q = cq.value; render(); const el=document.getElementById('cq'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length);} });
    bindSelect('cStatus', state.clientFilter, 'status');

    /* attendance */
    const attLocSeg = document.getElementById('attLocSeg');
    if(attLocSeg) attLocSeg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{
      attLocSeg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      state.attendanceLocationDraft = b.getAttribute('data-loc');
    }));
    const attCheckInBtn = document.getElementById('attCheckInBtn');
    if(attCheckInBtn) attCheckInBtn.addEventListener('click', attemptCheckIn);
    const attCheckOutBtn = document.getElementById('attCheckOutBtn');
    if(attCheckOutBtn) attCheckOutBtn.addEventListener('click', attemptCheckOut);
    const attRetryLocBtn = document.getElementById('attRetryLocBtn');
    if(attRetryLocBtn) attRetryLocBtn.addEventListener('click', ()=>{
      const rec = myAttendanceToday();
      if(rec && rec.checkInAt && !rec.checkOutAt) attemptCheckOut(); else attemptCheckIn();
    });
    const attCheckInFallbackBtn = document.getElementById('attCheckInFallbackBtn');
    if(attCheckInFallbackBtn) attCheckInFallbackBtn.addEventListener('click', ()=> checkInWithFallback(ensureAttendanceDraft()));
    const attCheckOutFallbackBtn = document.getElementById('attCheckOutFallbackBtn');
    if(attCheckOutFallbackBtn) attCheckOutFallbackBtn.addEventListener('click', ()=> checkOutWithFallback(ensureAttendanceDraft()));
    bindSelect('attFilterName', state.attendanceFilter, 'person');
    bindSelect('attFilterMonth', state.attendanceFilter, 'month');
    const attExportBtn = document.getElementById('attExportBtn');
    if(attExportBtn) attExportBtn.addEventListener('click', ()=>{
      const f = state.attendanceFilter;
      let list = state.attendance.slice();
      if(f.person!=='all') list = list.filter(a=>a.name===f.person);
      if(f.month!=='all') list = list.filter(a=>a.date.slice(0,7)===f.month);
      list.sort((a,b)=> a.date.localeCompare(b.date) || (a.name<b.name?-1:1));
      exportAttendanceCsv(list);
    });
  }
  function bindSelect(id, target, key){
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', ()=>{ target[key] = el.value; render(); });
  }

  /* ---------------- boot ---------------- */
  render();
  initDb();
  initDownloads();
  initAssets();

})();
</script>
</body>
</html>
